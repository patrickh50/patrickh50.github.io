<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The personal website of patrickh50.">
    <title>patrickh50</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 38rem;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 4rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 1rem 0 2rem;
        color: #536078;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1.1rem;
        border-radius: 0.5rem;
        background: #1f4fd1;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #173da8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>patrickh50</h1>
      <p>Welcome to my corner of the web. More coming soon.</p>
      <a href="https://github.com/patrickh50">Visit my GitHub profile</a>
    </main>
  </body>
</html>
